# Perfil docker: banco PostgreSQL rodando no container "db" do docker-compose
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/gameeducation}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gameeducation}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gameeducation}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console desligado quando roda em Postgres
spring.h2.console.enabled=false
